[package]
name = "rblx-spot"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde_json = "1.0.152"
ureq = { version = "3.4.2", default-features = false, features = ["json", "native-tls"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
opt-level = "s"

[build-dependencies]
winresource = "0.1.31"
