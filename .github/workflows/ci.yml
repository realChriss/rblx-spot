name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo clippy --release -- -D warnings
      - run: cargo test --release

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --release
      - shell: bash
        run: |
          mv target/release/rblx-spot.exe "rblx-spot-$GITHUB_REF_NAME.exe"
          gh release create "$GITHUB_REF_NAME" "rblx-spot-$GITHUB_REF_NAME.exe" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
